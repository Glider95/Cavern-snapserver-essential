# Snapserver configuration for Cavern-Snapserver Pipeline
# PROJECT PURPOSE: Wireless 7.1.4 Atmos system using ESP32-C5 endpoints
#
# Codec Selection Strategy:
# - Stereo (1-2ch): Opus - Best compression, low latency
# - Multichannel (>2ch): Ogg (Vorbis) - Up to 255 channels, good compression
# - Fallback: PCM - Uncompressed, high bandwidth

[stream]
# Read PCM audio from FIFO
# sampleformat and codec are updated by scripts based on OUTPUT_CHANNELS
source = pipe:///tmp/snapcast-out?name=Cavern&sampleformat=48000:16:6&codec=ogg

[http]
enabled = true
port = 1780

[tcp]
enabled = true
port = 1705

[server]
port = 1704
codec = ogg

# Buffer settings for wireless stability
buffer = 2000

[logging]
sink = stderr
