# Snapserver configuration for Cavern-Snapserver Pipeline
# PROJECT PURPOSE: Wireless 7.1.4 Atmos system using ESP32-C5 endpoints
# 
# IMPORTANT: Snapserver's Opus encoder only supports stereo (2ch), even though
# Opus itself supports up to 255 channels. This is a snapserver limitation.
#
# For multichannel audio (>2ch), options are:
# 1. pcm - Uncompressed, high bandwidth, works with any channels
# 2. flac - Lossless, max 8 channels
# 3. ogg - Could support multichannel (needs testing)

[stream]
# Read PCM audio from FIFO
# sampleformat and codec are updated by scripts based on OUTPUT_CHANNELS
# Default: 6ch (5.1) with PCM - Opus only supports stereo in snapserver
source = pipe:///tmp/snapcast-out?name=Cavern&sampleformat=48000:16:6&codec=pcm

[http]
# Web interface
enabled = true
port = 1780

[tcp]
# Control port
enabled = true
port = 1705

[server]
# Data stream port for clients
port = 1704

# Codec selection (updated by scripts):
# - opus: Best for stereo (WiFi efficient, low latency) - SNAPSERVER LIMITED TO 2CH
# - pcm: Uncompressed, any channel count, high bandwidth
# - flac: Lossless, max 8 channels
codec = pcm

# Buffer settings for wireless stability
buffer = 2000

[logging]
sink = stderr
