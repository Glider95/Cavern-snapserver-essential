# Snapserver configuration for Cavern-Snapserver Pipeline
# 
# Codec: FLAC for up to 8 channels, PCM for 9+ channels
# For 7.1.4 (12ch) Atmos, consider splitting into 6 stereo FLAC streams

[stream]
# chunk_ms: 20ms chunks, buffer: 2000ms
# Increase buffer for multichannel stability
source = pipe:///tmp/snapcast-out?name=Cavern&codec=flac&sampleformat=48000:16:6&chunk_ms=20&buffer_ms=2000

[http]
enabled = true
port = 1780

[tcp]
enabled = true
port = 1705

[server]
port = 1704
codec = flac
# Server buffer: 2000ms (2 second buffer for stability)
buffer = 2000
# Send audio to clients before buffer is full (helps with sync)
send_to_muted = false

[logging]
sink = stderr
