# Snapserver configuration for Cavern-Snapserver Pipeline
# 
# Codec: FLAC for up to 8 channels, PCM for 9+ channels
# For 7.1.4 (12ch) Atmos, consider splitting into 6 stereo FLAC streams

[stream]
source = pipe:///tmp/snapcast-out?name=Cavern&sampleformat=48000:16:6&codec=flac

[http]
enabled = true
port = 1780

[tcp]
enabled = true
port = 1705

[server]
port = 1704
codec = flac
buffer = 2000

[logging]
sink = stderr
