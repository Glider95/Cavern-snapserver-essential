# Snapserver configuration for Cavern-Snapserver Pipeline
# 
# Buffer strategy for multichannel sync stability:
# - chunk_ms: Read 20ms chunks from source (matches snapcast default)
# - buffer: 1000ms end-to-end latency (1 second, stable for WiFi)
#
# For sync issues, try increasing buffer to 2000ms

[stream]
source = pipe:///tmp/snapcast-out?name=Cavern&codec=flac&sampleformat=48000:16:6&chunk_ms=20

[http]
enabled = true
port = 1780

[tcp]
enabled = true
port = 1705

[server]
port = 1704
codec = flac
# Buffer: end-to-end latency in ms
# 1000ms = 1 second (good balance of sync and latency)
# Increase to 2000ms if you get buffer underruns
buffer = 1000

# Don't send audio to muted clients (saves bandwidth)
send_to_muted = false

[logging]
sink = stderr
