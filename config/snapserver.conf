# Snapserver configuration for Cavern-Snapserver Pipeline
# PROJECT PURPOSE: Wireless 7.1.4 Atmos system using ESP32-C5 endpoints
# 
# Codec Standard: Opus (lossy, efficient for WiFi streaming)
# - Supports up to 255 channels (full Atmos layouts)
# - ~5x more bandwidth efficient than FLAC
# - Lower latency for multi-speaker sync
# - Native ESP32 hardware support

[stream]
# Read PCM audio from FIFO
# sampleformat is updated by scripts based on OUTPUT_CHANNELS
# Default: 6ch (5.1) - change with environment variable
source = pipe:///tmp/snapcast-out?name=Cavern&sampleformat=48000:16:6&codec=opus

[http]
# Web interface
enabled = true
port = 1780

[tcp]
# Control port
enabled = true
port = 1705

[server]
# Data stream port for clients
port = 1704

# CODEC: opus (standardized for this project)
# - Lossy but transparent at 256kbps
# - Essential for WiFi streaming efficiency
# - Required for >8ch Atmos layouts (7.1.2, 7.1.4)
codec = opus

# Buffer settings for wireless stability
# Larger buffers prevent dropouts on congested WiFi
buffer = 2000

[logging]
# Log to stderr (captured by run.sh)
sink = stderr
