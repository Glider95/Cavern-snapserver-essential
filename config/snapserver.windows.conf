# Snapserver configuration for Cavern-Snapcast on Windows
# 
# This configuration uses TCP streaming instead of named pipes
# for better Windows compatibility.
#
# Buffer strategy for multichannel sync stability:
# - chunk_ms: Read 20ms chunks from source
# - buffer: 2000ms end-to-end latency (2 seconds, stable for WiFi)

[stream]
# TCP source - Cavern streams to this port
source = tcp://0.0.0.0:1804?name=Cavern&codec=flac&sampleformat=48000:16:6

# Alternative: Use pipe source if preferred
# source = pipe:////./pipe/snapcast-out?name=Cavern&codec=flac&sampleformat=48000:16:6

[http]
enabled = true
port = 1780
bind_to_address = 0.0.0.0

doc_root = 

[tcp]
enabled = true
port = 1705
bind_to_address = 0.0.0.0

[server]
port = 1704
bind_to_address = 0.0.0.0

# Codec: flac for up to 8 channels (good compression)
#        pcm for more channels (low latency)
codec = flac

# Buffer: end-to-end latency in milliseconds
# 2000ms = 2 seconds (good for WiFi stability)
# Decrease to 1000ms for lower latency on wired networks
buffer = 2000

# Sample format (updated dynamically by scripts)
sampleformat = 48000:16:6

# Don't send audio to muted clients (saves bandwidth)
send_to_muted = false

# Logging
[logging]
sink = stderr
filter = info

[streamingclient]
# Buffer for streaming clients
buffer = 1000
